
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forsion Desktop</title>
  <!-- PWA metadata (manifest is generated by vite-plugin-pwa at build time) -->
  <meta name="theme-color" content="#3E406F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forsion">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/pwa-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: 'var(--color-primary)',
            'surface-text': 'var(--color-text)',
          },
          fontFamily: {
            cursive: ['"Dancing Script"', 'cursive'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --color-primary: #3E406F;
      --color-secondary: #C1A3B5;
      --color-text: #2D2E4A;
      --glass-surface: rgba(255, 255, 255, 0.5);
      --glass-surface-light: rgba(255, 255, 255, 0.3);
      --bg-desktop: linear-gradient(to bottom, #98B0B9, #C1A3B5, #3E406F);

      /* Shared tokens */
      --radius-xs: 8px; --radius-sm: 12px; --radius-md: 16px;
      --radius-lg: 22px; --radius-xl: 28px; --radius-pill: 9999px;
      --ease-apple: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast: 200ms; --dur-normal: 300ms;
    }

    /* Light/Dark mode tokens — independent of desk theme */
    :root, [data-mode="light"] {
      --ui-surface: rgba(255,255,255,0.82);
      --ui-surface-sub: var(--glass-surface);
      --ui-border: rgba(0,0,0,0.08);
      --ui-border-sub: rgba(0,0,0,0.05);
      --ui-text: #1D1D1F;
      --ui-text-muted: #6E6E73;
      --ui-primary: #0891B2;
      --ui-primary-tint: rgba(8,145,178,0.07);
      --ui-gradient-from: #0891B2;
      --ui-gradient-to: #0D9488;
      --backdrop-glass: blur(20px) saturate(1.25);
      /* Icon surface — glass base lightly tinted with the desk theme primary.
         When auto-adapt is on, --color-primary is the extracted vibrant color so
         every icon follows the wallpaper together. When off, --color-primary is a
         neutral grayscale and the mix resolves to near-neutral glass. */
      --icon-surface: color-mix(in srgb, var(--color-primary) 18%, var(--ui-surface));
    }
    [data-mode="dark"] {
      --ui-surface: rgba(30,30,30,0.72);
      --ui-surface-sub: var(--glass-surface);
      --ui-border: rgba(255,255,255,0.08);
      --ui-border-sub: rgba(255,255,255,0.05);
      --ui-text: rgba(255,255,255,0.94);
      --ui-text-muted: rgba(255,255,255,0.5);
      --ui-primary: #22D3EE;
      --ui-primary-tint: rgba(6,182,212,0.12);
      --ui-gradient-from: #06B6D4;
      --ui-gradient-to: #2DD4BF;
      --backdrop-glass: blur(20px) saturate(1.25);
      --icon-surface: color-mix(in srgb, var(--color-primary) 18%, var(--ui-surface));
    }
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--color-secondary);
    }
    .glass {
      background: var(--glass-surface-light);
      -webkit-backdrop-filter: var(--backdrop-glass);
      backdrop-filter: var(--backdrop-glass);
      border: 1px solid var(--ui-border-sub);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      contain: layout paint;
      isolation: isolate;
    }
    .glass-dark {
      background: var(--glass-surface);
      -webkit-backdrop-filter: var(--backdrop-glass);
      backdrop-filter: var(--backdrop-glass);
      border: 1px solid var(--ui-border-sub);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      contain: layout paint;
      isolation: isolate;
    }
    .brush-stroke {
      opacity: 0.15;
      pointer-events: none;
      position: absolute;
      inset: 0;
      background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Theme-aware thin scrollbar */
    .scrollbar-thin::-webkit-scrollbar {
      width: 4px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: var(--color-primary);
      opacity: 0.3;
      border-radius: 4px;
    }
    .scrollbar-thin {
      scrollbar-width: thin;
      scrollbar-color: var(--color-primary) transparent;
    }
    .bg-desktop-surface {
      background: var(--bg-desktop);
      background-size: cover;
      background-position: center;
      transition: filter var(--dur-normal) var(--ease-apple), transform var(--dur-normal) var(--ease-apple);
    }
    /* Focus blur — wallpaper blurs when windows are open.
       Reduced from blur(10px) to blur(6px): 60% cheaper GPU filter pass with
       near-indistinguishable result because scale(1.05) already softens edges. */
    .bg-desktop-surface.wallpaper-focus-blur {
      filter: blur(6px) brightness(0.95);
      transform: scale(1.05);
    }
    /* Background overlay layer — sits above wallpaper, below content */
    .bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--dur-normal) var(--ease-apple);
    }
    .bg-overlay.show { opacity: 1; }
    /* Vignetting — single radial-gradient tuned to match the previous dual-stack
       look (edges ~0.5 alpha, inner 33% fully transparent). Halves compositor cost. */
    .bg-overlay.vignetting {
      background-image:
        radial-gradient(ellipse at center, transparent 33%, rgba(0,0,0,0.5) 120%);
    }
    /* Focus lite — semi-transparent overlay when focused */
    .bg-overlay.focus-lite {
      background-color: rgba(0,0,0,0.35);
    }
    /* Dock 特例：hover 放大的图标会向上溢出 dock 边界，不能被 `contain: paint` 裁剪。
       只保留 layout containment（允许合成器优化），放行 paint 以让溢出的图标可见。 */
    .dock-bar {
      contain: layout;
      overflow: visible;
    }

    /* GPU 加速样式 - 仅在 .gpu-acceleration 类激活时生效.
       注意：不再对 .glass / .glass-dark 全局挂 will-change —— 这会让所有玻璃面板常驻
       合成层、显著增加内存与首帧成本。framer-motion 动画期间会自动加 will-change，
       动画结束即移除。真正需要长期 promote 的元素请显式加 [data-gpu-accelerated]。 */
    body.gpu-acceleration [data-gpu-accelerated] {
      will-change: transform, opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* 用户可手动在设置里开启的「减少高性能视觉效果」——关闭合成器昂贵的 filter/
       backdrop-filter/大阴影/全屏模糊光晕，换成纯色 + 轻量阴影。保证动画流畅、
       文字清晰。机制上与 .gpu-acceleration / prefers-reduced-motion 平行，
       通过 body.reduced-fx 类开关。 */
    body.reduced-fx .glass {
      background: var(--ui-surface);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    body.reduced-fx .glass-dark {
      background: var(--ui-surface);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    /* 壁纸聚焦模糊是全屏 filter，代价巨大；关掉后只保留轻微 brightness 暗化 */
    body.reduced-fx .bg-desktop-surface.wallpaper-focus-blur {
      filter: brightness(0.88);
      transform: none;
    }
    /* 暗角叠加层是全屏径向渐变，低端机合成慢；关掉 */
    body.reduced-fx .bg-overlay.vignetting {
      background-image: none;
    }
    /* 装饰性白/黑圆形大模糊（140px / 110px / 120px blur 贴在巨型 div 上），
       是整个桌面最贵的三个图层之一；关掉 */
    body.reduced-fx .ambient-glow {
      display: none !important;
    }
    /* dock 浮动条：没有 backdrop-filter 时仍保留纯色背景以免完全透明 */
    body.reduced-fx .dock-bar {
      background: var(--ui-surface);
    }

    /* 系统级 reduced-motion：尊重用户的无障碍偏好，同时也作为低端机兜底。
       framer-motion 也会读这个 media query 并跳过过场。 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .bg-desktop-surface.wallpaper-focus-blur {
        filter: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
