server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 添加 resolver - 使用 Docker 内部 DNS（关键修改：支持运行时解析）
    resolver 127.0.0.11 valid=30s;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 代理 - 将 /api 请求转发到后端服务
    location /api {
        # 使用变量延迟解析（关键修改：避免启动时验证失败）
        # 根据后端实际位置选择以下之一：
        # - 同一 Docker 网络：http://forsion-backend:3001
        # - 宿主机：http://host.docker.internal:3001 或 http://172.17.0.1:3001
        # - 其他服务器 IP：http://172.20.0.2:3001
        set $backend http://172.20.0.2:3001;
        proxy_pass $backend;  # 使用变量而不是直接地址
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 健康检查端点
    location /health {
        # 同样使用变量延迟解析
        set $backend_health http://172.20.0.2:3001;
        proxy_pass $backend_health/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 404 /index.html;
}

