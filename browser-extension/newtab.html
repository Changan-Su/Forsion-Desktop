<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=https://forsion.net/" />
  <title>Forsion</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0c0f;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    .hint {
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="icons/icon-128.png" alt="Forsion" />
    <div class="hint">正在前往 forsion.net ...</div>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
