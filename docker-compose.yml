
services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: forsion-desk
    restart: unless-stopped
    ports:
      - "2005:80"
    networks:
      - forsion-network

networks:
  forsion-network:
    driver: bridge

